<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 950" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAkta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F5EFE0"/>
    </linearGradient>
  </defs>

  <rect width="700" height="950" fill="#FFFFFF"/>
  <rect x="25" y="25" width="650" height="900" fill="url(#bgAkta)" stroke="#C59B27" stroke-width="2.5" rx="8"/>
  <rect x="35" y="35" width="630" height="880" fill="none" stroke="#0F4C81" stroke-width="1.2"/>

  <!-- Ornamen Sudut Berbingkai Emas -->
  <path d="M40 70 L70 40 M40 80 L80 40 M630 40 L660 70 M620 40 L660 80 M40 880 L70 910 M40 870 L80 910 M630 910 L660 880 M620 910 L660 870" stroke="#C59B27" stroke-width="1.5"/>

  <!-- Lambang Garuda & Kop Akta Kelahiran -->
  <g transform="translate(350, 95)" text-anchor="middle">
    <circle cx="0" cy="0" r="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="0" y="8" font-family="serif" font-size="22" font-weight="bold" fill="#92400E">🇮🇩</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#0A2540" letter-spacing="2">REPUBLIK INDONESIA</text>
    <text x="0" y="72" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F4C81" letter-spacing="1">DINAS KEPENDUDUKAN DAN PENCATATAN SIPIL</text>
    <text x="0" y="90" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569">KABUPATEN LAMONGAN</text>
    
    <!-- Garis Pemisah -->
    <line x1="-240" y1="106" x2="240" y2="106" stroke="#C59B27" stroke-width="2"/>
    <line x1="-200" y1="110" x2="200" y2="110" stroke="#0F4C81" stroke-width="1"/>

    <text x="0" y="145" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#0A2540" letter-spacing="2">KUTIPAN AKTA KELAHIRAN</text>
    <text x="0" y="170" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#64748B">WARGA NEGARA INDONESIA</text>
    <text x="0" y="195" font-family="monospace" font-size="13" font-weight="bold" fill="#0F4C81">Nomor: 3524-LT-12052011-0048</text>
  </g>

  <!-- Isi Teks Pernyataan Lahir -->
  <g transform="translate(85, 340)" font-family="Georgia, serif" font-size="14" fill="#1E293B" line-height="1.8">
    <text x="0" y="0">Berdasarkan Akta Kelahiran Nomor <tspan font-family="monospace" font-weight="bold">3524-LU-12052011-0048</tspan>,</text>
    <text x="0" y="28">menurut Daftar Kelahiran Umum tertulis bahwa di:</text>
    
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0A2540">LAMONGAN</text>
    
    <text x="0" y="105">pada hari <tspan font-weight="bold">Kamis</tspan>, tanggal <tspan font-weight="bold">Dua Belas</tspan>, bulan <tspan font-weight="bold">Mei</tspan>, tahun <tspan font-weight="bold">Dua Ribu Sebelas</tspan></text>
    <text x="0" y="132">(12-05-2011) telah lahir seorang anak laki-laki bernama:</text>

    <!-- Nama Santri Besar -->
    <rect x="-10" y="155" width="550" height="46" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" rx="6"/>
    <text x="265" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#0A2540" text-anchor="middle" letter-spacing="1">AHMAD RAYHAN AL-GHIFARI</text>

    <text x="0" y="235">anak ke <tspan font-weight="bold">Satu (1)</tspan> dari pasangan suami-isteri:</text>
    
    <text x="30" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F4C81">• Ayah : HENDRA GUNAWAN</text>
    <text x="30" y="298" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F4C81">• Ibu &nbsp;: SITI AMINAH</text>
  </g>

  <!-- Tanggal & Legalisasi Disdukcapil -->
  <g transform="translate(420, 710)" font-family="Arial, sans-serif" font-size="12" fill="#1E293B">
    <text x="0" y="0">Dikeluarkan di: Lamongan</text>
    <text x="0" y="22">Pada Tanggal: 18 Mei 2011</text>
    <text x="0" y="44" font-weight="bold">Pejabat Pencatatan Sipil</text>
    
    <!-- Stempel Bulat Biru & QR -->
    <circle cx="65" cy="105" r="38" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="4 2" opacity="0.6"/>
    <text x="65" y="102" font-size="9" font-weight="bold" fill="#1D4ED8" text-anchor="middle">DISDUKCAPIL</text>
    <text x="65" y="115" font-size="8" font-weight="bold" fill="#1D4ED8" text-anchor="middle">KAB. LAMONGAN</text>
    
    <text x="0" y="165" font-weight="bold" text-decoration="underline">H. MOH. RIDWAN, S.H., M.M.</text>
    <text x="0" y="182" font-size="11" fill="#64748B">NIP. 19680415 199203 1 005</text>
  </g>

  <!-- Lencana Status Dokumen Terverifikasi -->
  <g transform="translate(65, 870)">
    <rect width="270" height="32" fill="#ECFDF5" stroke="#10B981" rx="6"/>
    <text x="12" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#047857">✓ DOKUMEN ASLI SAH PPDB ONLINE 2026</text>
  </g>
</svg>
