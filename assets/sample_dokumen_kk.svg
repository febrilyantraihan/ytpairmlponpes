    <text x="45" y="106" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0A2540">AHMAD RAYHAN AL-GHIFARI ★</text>
    <text x="250" y="106" font-family="monospace" font-size="11" font-weight="bold" fill="#0F4C81">3524101205110003</text>
